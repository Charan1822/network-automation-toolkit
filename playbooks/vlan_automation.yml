---
# vlan_automation.yml
# Pushes a target VLAN set to every access switch in the inventory.
# Run with --check for a dry-run that shows what WOULD change, with no writes.
#
#   ansible-playbook -i ansible_inventory.yml playbooks/vlan_automation.yml --check
#   ansible-playbook -i ansible_inventory.yml playbooks/vlan_automation.yml
#
# Requires: ansible, cisco.ios collection (ansible-galaxy collection install cisco.ios)

- name: Ensure target VLANs exist on all access switches
  hosts: access_switches
  gather_facts: no
  connection: network_cli

  vars:
    target_vlans:
      - vlan_id: 10
        name: USERS
      - vlan_id: 20
        name: VOICE
      - vlan_id: 40
        name: GUEST

  tasks:
    - name: Create or update VLANs
      cisco.ios.ios_vlans:
        config: "{{ target_vlans }}"
        state: merged
      register: vlan_result

    - name: Report outcome
      debug:
        msg: >
          {{ 'CHECK MODE (no changes written): ' if ansible_check_mode else 'APPLIED: ' }}
          {{ vlan_result.changed }} change(s) on {{ inventory_hostname }}
